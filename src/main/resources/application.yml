spring:
  application:
    name: experian-custodia
    
  jpa:
      hibernate:
        naming:
          physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
          implicit-strategy: org.hibernate.boot.model.naming.ImplicitNamingStrategyJpaCompliantImpl
        ddl-auto: validate

server:
  port: 6002

app:
  kafka:
    topics:
      custodia-orden: documento.custodia.orden
      custodia-resultado: documento.custodia.resultado